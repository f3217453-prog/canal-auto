# Guarda este archivo en tu repo como: .github/workflows/clipping.yml
# (el mismo repo donde ya tienes daily.yml, solo un archivo nuevo)

name: AI Clipping

on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: "URL del stream/video a clippear (YouTube, Twitch VOD, etc.)"
        required: true

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar el video fuente
        run: yt-dlp -o "input/stream.mp4" "${{ github.event.inputs.stream_url }}"

      - name: Correr el pipeline de clipping
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIPS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_CLIPS_REFRESH_TOKEN }}
        run: python main.py input/stream.mp4
