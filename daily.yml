name: Video diario automático

on:
  schedule:
    - cron: "0 14 * * *"   # todos los días a las 14:00 UTC (ajusta a tu hora)
  workflow_dispatch: {}    # también puedes darle "Run workflow" a mano desde el móvil

jobs:
  crear-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg (necesario para audio/video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Ejecutar el pipeline completo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py
